# 地球ビューティショット（テクスチャ・雲・夜光・大気・自転）
# 使用: python satellite_orbit.py --config presets/earth_beauty.yaml
# 注意: テクスチャファイルは各自で用意してください（NASA Blue Marble等）
#
# 2026-08-18 修正:
#   - テクスチャキー名を argparse dest に一致させた
#     （day_texture → earth_day_texture 等。旧キーは render 系 CLI では
#      config_loader の earth: セクションで別名変換されるが、GUI/ライブ
#      プレビュー経路では無視されていた）
#   - トーンを exposure -0.5 / gamma 2.2 に（旧 -2.0 / 1.0 はほぼ真っ黒）
#   - atmosphere_density 0.5（scene_builder が大気使用時に volpath へ
#     切り替わる修正とセット。density は sigma_t の rgb 上限のため <= 1.0）
#   - samples 64（volpath の媒質ノイズ対策。プレビューは GUI ライブで確認可）

rendering:
  frames: 100
  width: 1920
  height: 1080
  samples: 64
  exposure: -0.5
  gamma: 2.2

camera:
  view_mode: inertial

earth:
  earth_only: true
  earth_day_texture: assets/textures/earth_day.jpg
  earth_night_texture: assets/textures/earth_night.jpg
  earth_cloud_texture: assets/textures/earth_clouds.jpg
  use_night_lights: true
  use_clouds: true
  cloud_opacity: 0.2
  use_atmosphere: true
  atmosphere_density: 0.5
  atmosphere_radius_scale: 1.03
  earth_rotation: true
  earth_rotation_speed: 300

animation:
  duration_sec: 50
  fps: 1

lighting:
  hdri_path: "assets/starfield.exr"
  starfield_brightness: 1.0
  advanced_optics: true
  sun_rotate: true
  sun_rotate_period: 100
  sun_rotate_speed: 2.0
